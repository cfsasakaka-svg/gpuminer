name: Deploy GPUMINER to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deployment tools
        run: |
          npm install -g wrangler@3.90.0
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Provision database and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MONETAG_POSTBACK_SECRET: ${{ secrets.MONETAG_POSTBACK_SECRET }}
          ADMIN_TELEGRAM_ID: ${{ secrets.ADMIN_TELEGRAM_ID }}
          MONETAG_SDK_SCRIPT_URL: ${{ secrets.MONETAG_SDK_SCRIPT_URL }}
          MONETAG_SDK_ZONE_ID: ${{ secrets.MONETAG_SDK_ZONE_ID }}
          CRYPTAPI_WALLET_ADDRESS: ${{ secrets.CRYPTAPI_WALLET_ADDRESS }}
          CRYPTAPI_CALLBACK_BASE: ${{ secrets.CRYPTAPI_CALLBACK_BASE }}
        run: bash scripts/deploy-pages.sh

      - name: Restore Telegram Mini App launch button
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          response=$(curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setChatMenuButton" \
            --data-urlencode 'menu_button={"type":"web_app","text":"Abrir GPU Miner","web_app":{"url":"https://gpuminer.pages.dev/"}}')
          echo "$response" | jq -e '.ok == true'
